overlay: 1.0.0
info:
  title: UTM API Overlay
  version: 0.1.0
actions:
  # Support for unbounded geo zones
  - target: $.components.schemas.ConstraintReference.required[?(@ == 'time_start' || @ == 'time_end')]
    description: Update constraint Reference with relaxed time bounds
    remove: true
  # Embed ED-318 geo zone in ConstraintDetails
  - target: $.components.schemas.ConstraintDetails
    description: Update constraint Details with ED-318 GeoZone field
    update:
      required:
        - volumes
        - geozone_ed318
      properties:
        geozone_ed318:
          description: >-
            The ED-318 geo zone from which this constraint originates
          type: object
